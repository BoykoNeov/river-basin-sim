# M6 scenario (HANDOFF §7.1, §9 M6) -- reach: tiling at scale + resolution choice
# + sub-grid channels, all three at once.
#
#   * [grid] tiles = "all"  -> the domain is the whole 6x6 tile mosaic (1536x1536 @
#     50 m = 76.8 km square), not tile 0 (solver/io/mosaic.py);
#   * [grid] coarsen = 2    -> the run steps a 768x768 grid at 100 m: a quarter of
#     the cells, one uniform grid (solver/io/coarsen.py);
#   * [channels]            -> the river (7-45 m wide) is *narrower than a cell*
#     at either resolution and is carried sub-grid, so coarsening loses cells
#     rather than the river (solver/core/channels.py).
#
# Cell indices below are in the **assembled-domain** frame -- after [grid] window,
# before coarsen -- i.e. the 1536x1536 mosaic. The solver maps them (i // 2) and
# refuses any that fall outside the resolved domain.
#
# Generate the synthetic basin + channel fields first:
#   uv run python scripts/make_reach_demo.py
# Then run:
#   uv run python -m solver.run --config scenarios/reach_basin.toml

[meta]
name = "reach_basin"
seed = 12345
scheme = "local_inertial"        # sub-grid channels are LI-only (M6 plan §0)

[grid]
tiles_dir = "data/tiles/reach_demo"   # dx / crs inherit from tiles.json
tiles = "all"                         # the domain is the mosaic
coarsen = 2                           # 50 m tiles -> a 100 m run grid
# A basin sitting at 85-565 m with a millimetre-thin rain sheet is exactly the
# float32 eta = h + z conditioning case (CLAUDE.md): without the shift this run
# drifts to 8.7e-7 -- inside the gate, but for arithmetic reasons, not physics.
datum = "auto"

[run]
end_time = 43200.0               # 12 h simulated -- long enough for the wave
output_every = 1800.0            # 25 frames                to reach the outlet
cfl = 0.7
dt_max = 20.0

[rainfall]
type = "uniform"
rate_mm_hr = 15.0
duration_s = 7200.0              # a 2 h storm over the whole basin

[parameters]
manning_n = 0.06                 # vegetated floodplain

# Sub-grid channel geometry, from downstream hydraulic geometry over the basin's
# drainage area (pipeline/channels.py -- the coefficients are calibration inputs,
# recorded in data/fields/reach_demo/channels.json). Fields are authored at tile
# resolution and aggregated to the run grid by block max, so the river survives.
[channels]
width = "../data/fields/reach_demo/channel_width.r32"
depth = "../data/fields/reach_demo/channel_depth.r32"
manning = 0.03                   # a channel is smoother than its floodplain

# The upstream reach entering at the head of the valley: a flood wave that rises
# over an hour, holds, then recedes.
[[inflow]]
cell = [4, 768]
hydrograph = [[0.0, 5.0], [3600.0, 60.0], [10800.0, 60.0], [18000.0, 10.0]]

[boundaries]
default = "closed"
south = "open"                   # the basin outlet -- water leaves the domain
